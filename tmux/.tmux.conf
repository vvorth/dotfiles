# vim: set filetype=tmux :


#### TERMINAL ####

# tmux-256color is the correct TERM inside tmux (italics, true colour), but
# its terminfo entry is missing on some systems (older macOS /usr/share/terminfo),
# where programs would then misbehave -- fall back to screen-256color there.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Tell tmux the outer terminal does 24-bit colour (starship's hex ramp, nvim's
# termguicolors), undercurl + coloured underlines (nvim diagnostics) and
# OSC 52 clipboard. Listed per terminal, not "*", so a bare Linux console
# (TERM=linux) doesn't get RGB forced on it. iTerm2 reports xterm-256color.
set -as terminal-features ",xterm-256color:RGB:usstyle:clipboard"
set -as terminal-features ",xterm-ghostty:RGB:usstyle:clipboard"
set -as terminal-features ",xterm-kitty:RGB:usstyle:clipboard"
set -as terminal-features ",alacritty:RGB:usstyle:clipboard"
set -as terminal-features ",wezterm:RGB:usstyle:clipboard"

# For neovim
set-option -g focus-events on

# For image previews (yazi, vifm+chafa): let graphics escape sequences
# reach the real terminal, and forward the env vars image tools use to
# identify it -- TERM_PROGRAM itself is useless here since tmux always
# overwrites it to "tmux" for panes, but these survive. Only refreshed
# into *new* panes/windows on `tmux attach`, not ones already open, so
# after changing this: detach, reattach, and open a fresh pane/window
# (or `tmux kill-server` and start over) before testing.
set -g allow-passthrough on
set -ga update-environment "LC_TERMINAL LC_TERMINAL_VERSION GHOSTTY_BIN_DIR GHOSTTY_RESOURCES_DIR KITTY_PID WEZTERM_EXECUTABLE"

# Panes inherit the SHLVL of whatever shell started the server, so every pane
# would count as a nested shell (starship's shlvl module shows from 2 up).
# Dropping it makes a pane start at 1, same as a fresh terminal tab.
set-environment -gu SHLVL


#### UX ####

# window numbering starts with 1
set -g base-index 1
setw -g pane-base-index 1

# renumber windows
set-option -g renumber-windows on

# Default 10ms, which is the classic "ESC feels laggy in nvim" cause.
set -sg escape-time 0

#
set -g history-limit 50000


# Enable a bottom border frame ONLY when zoomed. `set -w` scopes it to the
# window being zoomed -- with -g, zooming one window made every other split
# window show the MAXIMIZED banner too. The -g off is the default for the
# rest, and also resets a global "bottom" left behind by the old hook.
set -g pane-border-status off
set-hook -g after-resize-pane "if-shell -F '#{window_zoomed_flag}' 'set -w pane-border-status bottom' 'set -w pane-border-status off'"
# Style the border and text to look distinct
set -g pane-border-format "#[fg=black,bg=yellow,bold]  ▲ MAXIMIZED TILE (Press Prefix+Z to exit)  #[default]────────────────────────────────────────────────"
set -g pane-active-border-style "fg=yellow"


#### MOUSE ####

set -g mouse on

#### COPY MODE / CLIPBOARD ####

# vi keys in copy mode (prefix [): v to start a selection, C-v for a block,
# y to yank. With set-clipboard on, every tmux copy -- keyboard or mouse
# drag -- goes to the *system* clipboard via OSC 52, including over SSH, and
# programs inside tmux (nvim's "+y over SSH) can set it the same way.
setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

#### BINDS ####

# Ctrl-A as main prefix
unbind C-b
set -g prefix C-a

# Reload config
bind r source-file ~/.tmux.conf \; display "reloaded"

#Ctrl+a, Ctrl+a to swap between windows
unbind l
bind C-a last-window

#Ctrl+a a to send Ctrl+a
bind a send-key C-a
bind A send-key C-a

# Splits that inherit cwd — the single most-missed tmux default
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
# bind c   new-window -c "#{pane_current_path}"

# move selected window into a horizontal split
bind @ choose-window "join-pane -h -s '%%'"
# move selected window into a split
bind '#' choose-window "join-pane -s '%%'"
# opposite is break-pane or <prefix>!

# The default prefix + arrow key is slow because it needs the prefix every time and arrow keys
# are a hand-reach. Remap to vim-style, still with prefix:
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# For resizing, the key is -r (repeatable) so you don't need to hit prefix before every single resize
# step — within the repeat window (default 500ms) you can just mash the key:
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# If you use nvim splits alongside tmux splits, the single most-recommended upgrade is vim-tmux-navigator
# (or Neovim's built-in equivalent) — it lets <C-h/j/k/l> move between vim splits and tmux panes with the
# same keys, no prefix needed, no mental context-switch about which "layer" you're in:
# INFO: works on it's own with jsut a plugin for some reason
is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"




#### COLOR ####

# The status bar wears this machine's host palette -- the same ramp as the
# starship prompt, defined once in ~/.config/host-palette/palettes. Everything
# below refers to it only as #{@hp_c1}..#{@hp_t5} (tmux expands formats inside
# style options), and host-palette/tmux.sh fills those in, so this file holds
# the layout and no host colours. `host-palette -w NAME` repaints a running
# server without a reload.
#
#   host ▌ session ▌ 1 zsh -▌2 nvim▌3 vifm            󰌌  14:02
#   c1     c3        c5 bar, current window on c2        c5
#
# ANSI stand-ins, only seen if the host-palette package is not stowed.
set -g @hp_c1 white
set -g @hp_c2 blue
set -g @hp_c3 brightblack
set -g @hp_c4 black
set -g @hp_c5 black
set -g @hp_t1 black
set -g @hp_t2 brightwhite
set -g @hp_t5 white
run-shell 'f="${XDG_CONFIG_HOME:-$HOME/.config}/host-palette/tmux.sh"; [ -x "$f" ] && "$f"; true'

set -g status-style "bg=#{@hp_c5},fg=#{@hp_t5}"
set -g status-left-length 60
set -g status-right-length 40

# Host on the brightest stop (what the colour exists to tell you), then the
# session, stepping down the ramp with the same half-block edges as starship.
set -g status-left "#[fg=#{@hp_c1},bg=default]#[fg=#{@hp_t1},bg=#{@hp_c1},bold]#h#[fg=#{@hp_c1},bg=#{@hp_c3},nobold]▌#[fg=#{@hp_t2},bg=#{@hp_c3}]#S #[fg=#{@hp_c3},bg=#{@hp_c5}]▌ "

set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_flags,#{window_flags}, } "
set -g window-status-current-format "#[fg=#{@hp_c5},bg=#{@hp_c2}]▌#[fg=#{@hp_t1},bg=#{@hp_c2},bold]#I #W#{?window_zoomed_flag, 󰊓,} #[fg=#{@hp_c2},bg=#{@hp_c5},nobold]▌"
set -g window-status-activity-style "fg=yellow,bg=#{@hp_c5}"
set -g window-status-bell-style "fg=red,bg=#{@hp_c5},bold"

# Right: a key icon while the prefix is held, then the clock.
set -g status-right "#{?client_prefix,#[fg=yellow#,bold] 󰌌 ,}#[fg=#{@hp_t5},nobold] %H:%M "

set -g message-style "fg=#{@hp_t1},bg=#{@hp_c2}"
set -g message-command-style "fg=#{@hp_t1},bg=#{@hp_c1}"


# Attempt to load local config
source-file -q ~/.tmux.conf.local

