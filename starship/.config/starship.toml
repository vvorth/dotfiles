c5 = "#242529"
t1 = "#0c0d0d"
t2 = "#ecedee"
t5 = "#b0b3ba"


# ---------------------------------------------------------------------------
# c1 -- the brightest stop holds what the whole scheme exists to tell you
# ---------------------------------------------------------------------------

[os]
disabled = false
style = "bg:c1 fg:t1"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = "󰀵"
Arch = "󰣇"
Artix = "󰣇"
Debian = "󰣚"
Ubuntu = "󰕈"
Fedora = "󰣛"
CentOS = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Alpine = ""
Gentoo = "󰣨"
Manjaro = ""
Mint = "󰣭"
SUSE = ""
EndeavourOS = ""
Pop = ""
Raspbian = "󰐿"
Android = ""
Linux = "󰌽"
Windows = "󰍲"

# Only rendered when root or over SSH (starship's default), so the laptop stays
# short and remote sessions say who you are.
[username]
style_user = "bg:c1 fg:t1"
style_root = "bg:c1 fg:t1 bold"
format = "[$user@]($style)"

[hostname]
ssh_only = false
# Trails the hostname rather than leading it, so it does not wedge itself
# between the "user@" and the name.
ssh_symbol = " "
style = "bg:c1 fg:t1"
format = "[$hostname$ssh_symbol ]($style)"
trim_at = "."


# ---------------------------------------------------------------------------
# c2 -- directory
# ---------------------------------------------------------------------------

[directory]
style = "fg:t2 bg:c2"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = "󰌾 "
read_only_style = "fg:t2 bg:c2"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Movies" = " "
"Developer" = " "
".config" = " "


# ---------------------------------------------------------------------------
# c3 -- git. The one place a second colour is allowed: one hue per kind of
# change, in ANSI names so they follow the terminal theme rather than the ramp.
# ---------------------------------------------------------------------------

[git_branch]
symbol = ""
style = "bg:c3"
format = "[ $symbol $branch]($style)"

[git_status]
conflicted = " ${count}"
staged = " ${count}"
modified = " ${count}"
renamed = "󰑕 ${count}"
deleted = " ${count}"
typechanged = " ${count}"
untracked = " ${count}"
stashed = " ${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
# Each item is its own conditional group, so a clean repo prints nothing at all
# rather than a row of zeroes.
format = """\
([ $conflicted](bold fg:red bg:c3))\
([ $staged](fg:green bg:c3))\
([ $modified](fg:yellow bg:c3))\
([ $renamed](fg:purple bg:c3))\
([ $deleted](fg:red bg:c3))\
([ $typechanged](fg:blue bg:c3))\
([ $untracked](fg:bright-blue bg:c3))\
([ $stashed](fg:cyan bg:c3))\
([ $ahead_behind](fg:bright-purple bg:c3))\
[ ](bg:c3)"""


# ---------------------------------------------------------------------------
# c4 -- toolchain versions
# ---------------------------------------------------------------------------

[nodejs]
symbol = ""
style = "fg:c2 bg:c4"
format = "[ $symbol $version ]($style)"

[bun]
symbol = ""
style = "fg:c2 bg:c4"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:c2 bg:c4"
format = '[ $symbol ${version}(\($virtualenv\)) ]($style)'

[rust]
symbol = ""
style = "fg:c2 bg:c4"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "fg:c2 bg:c4"
format = "[ $symbol $version ]($style)"

[lua]
symbol = ""
style = "fg:c2 bg:c4"
format = "[ $symbol $version ]($style)"

[php]
symbol = ""
style = "fg:c2 bg:c4"
format = "[ $symbol $version ]($style)"

[package]
symbol = "󰏗"
style = "fg:c2 bg:c4"
format = "[ $symbol $version ]($style)"


# ---------------------------------------------------------------------------
# c5 -- the darkest stop: what the last command did, and the clock
# ---------------------------------------------------------------------------

[jobs]
symbol = "󰜎"
style = "fg:t5 bg:c5"
format = "[ $symbol $number]($style)"

[cmd_duration]
min_time = 2000
style = "fg:t5 bg:c5"
format = "[ 󱎫 $duration]($style)"

[status]
disabled = false
symbol = ""
style = "fg:red bg:c5"
format = "[ $symbol $status]($style)"

[time]
disabled = false
time_format = "%R"
style = "fg:t5 bg:c5"
format = "[  $time ]($style)"

[character]
success_symbol = "[❯](bold fg:c2)"
error_symbol = "[❯](bold fg:red)"
vicmd_symbol = "[❮](bold fg:yellow)"
