# starship prompt -- https://starship.rs
#
# The tokyo-night preset's powerline bar, with its single blue ramp replaced by
# one ramp per machine. The gradient still runs bright -> dark left to right;
# only its hue changes per host, so a glance at the bar says where you are.
#
#   ░▒▓ 󰀵 mbp ▓ ~/dev/dotfiles ▓  main  1 ?2 ▓  v22.2.0 ▓  13:44 ▓
#   ❯
#
# Every palette below is generated from one HSL recipe, so all hues read as the
# same design. At H=222 that recipe reproduces tokyo-night's own ramp (c4 and c5
# come out identical to the preset's hex, the rest within a couple of points) --
# the `blue` palette is effectively the preset.
#
#   c1  lightest -- the OS/host pill, the brightest thing on the line
#   c2  vivid    -- the directory pill, and the text colour on the dark stops
#   c3  dark     -- git
#   c4  darker   -- toolchain versions
#   c5  darkest  -- duration / status / jobs / clock
#   t1  near-black text for the c1 pill, t2 light text for c2, t5 muted for c5
#
# `palette` is rewritten per host by sh/conf.d/60-starship.sh into a generated
# copy under ~/.cache/starship/; this file stays the only one to edit. Switch
# with `starship-palette purple`, persist with `starship-palette -w purple`.
# See CLAUDE.md -> "## starship".
#
# NOTE: starship has no config includes and does not expand env vars inside
# style strings (both confirmed against starship 1.26), which is why the
# generate-a-copy dance exists instead of something more direct.

"$schema" = 'https://starship.rs/config-schema.json'

# Rewritten per host by 60-starship.sh. Keep this line's exact shape
# (`palette = "..."` at column 0) -- the sed in that script matches on it.
palette = "slate"

add_newline = true
command_timeout = 1000

format = """
[░▒▓](c1)\
$os\
$username\
$hostname\
[](fg:c1 bg:c2)\
$directory\
[](fg:c2 bg:c3)\
$git_branch\
$git_status\
[](fg:c3 bg:c4)\
$nodejs\
$bun\
$python\
$rust\
$golang\
$lua\
$php\
$package\
[](fg:c4 bg:c5)\
$jobs\
$cmd_duration\
$status\
$time\
[](fg:c5)\
$line_break\
$character"""


# ---------------------------------------------------------------------------
# Palettes: one ramp per host. Generated, not hand-picked -- see the recipe in
# the header. Add a palette here and `starship-palette` picks it up with no
# other change.
# ---------------------------------------------------------------------------

[palettes.blue]
c1 = "#a2b1d2"
c2 = "#759af0"
c3 = "#384461"
c4 = "#212736"
c5 = "#1d2230"
t1 = "#0b0c0e"
t2 = "#e9ebf2"
t5 = "#a3aec8"

[palettes.cyan]
c1 = "#a2cdd2"
c2 = "#75e2f0"
c3 = "#385c61"
c4 = "#213336"
c5 = "#1d2e30"
t1 = "#0b0e0e"
t2 = "#e9f1f2"
t5 = "#a3c3c8"

[palettes.green]
c1 = "#a2d2a8"
c2 = "#75f085"
c3 = "#38613d"
c4 = "#213624"
c5 = "#1d301f"
t1 = "#0b0e0c"
t2 = "#e9f2ea"
t5 = "#a3c8a7"

[palettes.purple]
c1 = "#c2a2d2"
c2 = "#c775f0"
c3 = "#533861"
c4 = "#2f2136"
c5 = "#291d30"
t1 = "#0d0b0e"
t2 = "#efe9f2"
t5 = "#bba3c8"

[palettes.amber]
c1 = "#d2c1a2"
c2 = "#f0c375"
c3 = "#615238"
c4 = "#362e21"
c5 = "#30291d"
t1 = "#0e0d0b"
t2 = "#f2eee9"
t5 = "#c8baa3"

[palettes.rose]
