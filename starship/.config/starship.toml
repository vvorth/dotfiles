# starship prompt -- https://starship.rs
#
# The tokyo-night preset's powerline bar, with its single blue ramp replaced by
# one ramp per machine. The gradient still runs bright -> dark left to right;
# only its hue changes per host, so a glance at the bar says where you are.
#
#   ░▒▓ 󰀵 mbp ▓ ~/dev/dotfiles ▓  main  1 ?2 ▓  v22.2.0 ▓  13:44 ▓
#   ❯
#
# The ramp is not defined here. Every host-specific colour lives in
# ~/.config/host-palette/palettes (the host-palette package), shared with the
# tmux status bar; sh/conf.d/60-starship.sh appends this machine's row to a
# generated copy of this file as [palettes.host]. Stops, as used below:
#
#   c1  lightest -- the OS/host pill, the brightest thing on the line
#   c2  vivid    -- the directory pill, and the prompt character
#   c3  dark     -- git
#   c4  darker   -- toolchain versions
#   c5  darkest  -- duration / status / jobs / clock
#   t1  near-black text for c1/c2, t2 light text, t5 muted text for c5
#
# This file stays the only one to edit for layout. Switch colours with
# `host-palette purple`, persist with `host-palette -w purple`.
# See CLAUDE.md -> "## host palette" and "## starship".
#
# NOTE: starship has no config includes and does not expand env vars inside
# style strings (both confirmed against starship 1.26), which is why the
# generate-a-copy dance exists instead of something more direct.

"$schema" = 'https://starship.rs/config-schema.json'

# Defined nowhere in this file: 60-starship.sh appends [palettes.host], this
# machine's row from ~/.config/host-palette/palettes, to a generated copy.
# Used on its own (e.g. `STARSHIP_CONFIG=this starship prompt`), starship
# warns about the missing palette and renders unstyled.
palette = "host"

add_newline = false
command_timeout = 1000

# 
# format = """
# [░▒▓](c1)\
# $os\
# $username\
# $hostname\
# [](fg:c1 bg:c2)\
# $directory\
# [](fg:c2 bg:c3)\
# $git_branch\
# $git_state\
# $git_status\
# [](fg:c3 bg:c4)\
# $nodejs\
# $bun\
# $python\
# $rust\
# $golang\
# $lua\
# $php\
# $package\
# $docker_context\
# [](fg:c4 bg:c5)\
# $shlvl\
# $jobs\
# $cmd_duration\
# $status\
# $time\
# [](fg:c5)\
# $line_break\
# $character"""
# ░▒▓▌

format = """
[](fg:c1)\
$os\
$username\
$hostname\
[▌](fg:c1 bg:c2)\
$directory\
[▌](fg:c2 bg:c3)\
$git_branch\
$git_state\
$git_status\
[▌](fg:c3 bg:c4)\
[\
$docker_context\
](fg:c2 bg:c4)\
[▌](fg:c4 bg:c5)\
$shlvl\
$jobs\
$cmd_duration\
$status\
[](fg:c5)\
$character\
"""


# ---------------------------------------------------------------------------
# c1 -- the brightest stop holds what the whole scheme exists to tell you
# ---------------------------------------------------------------------------

[os]
disabled = true
style = "bg:c1 fg:t1"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = "󰀵"
Arch = "󰣇"
Artix = "󰣇"
Debian = "󰣚"
Ubuntu = "󰕈"
Fedora = "󰣛"
CentOS = ""
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Alpine = ""
Gentoo = "󰣨"
Manjaro = ""
Mint = "󰣭"
SUSE = ""
EndeavourOS = ""
Pop = ""
Raspbian = "󰐿"
Android = ""
Linux = "󰌽"
Windows = "󰍲"

# Only rendered when root or over SSH (starship's default), so the laptop stays
# short and remote sessions say who you are.
[username]
style_user = "bg:c1 fg:t1"
style_root = "bg:c1 fg:t1 bold"
format = "[$user@]($style)"

[hostname]
ssh_only = false
# Trails the hostname rather than leading it, so it does not wedge itself
# between the "user@" and the name.
ssh_symbol = "󰢩"
style = "bg:c1 fg:t1"
# format = "[ $hostname $ssh_symbol]($style)"
format = "[$hostname]($style)"
trim_at = "."


# ---------------------------------------------------------------------------
# c2 -- directory
# ---------------------------------------------------------------------------

[directory]
style = "fg:t1 bg:c2"
format = "[$path]($style)[ $read_only]($read_only_style)"
read_only = "󰌾"
read_only_style = "fg:t1 bg:c2"
# Inside a repo, the repo's own name is bold, so it stays findable after the
# path has been truncated.
before_repo_root_style = "fg:t1 bg:c2"
repo_root_style = "bold fg:t1 bg:c2"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Movies" = "󰎁"
"Developer" = "󰚗"
".config" = ""


# ---------------------------------------------------------------------------
# c3 -- git. The one place a second colour is allowed: one hue per kind of
# change, in ANSI names so they follow the terminal theme rather than the ramp.
# ---------------------------------------------------------------------------

[git_branch]
symbol = ""
style = "bg:c3"
format = "[ $symbol $branch]($style)"

# Mid-rebase / merge / cherry-pick / bisect, with progress where git has it.
[git_state]
style = "bold fg:yellow bg:c3"
format = "[$state( $progress_current/$progress_total)]($style)"

[git_status]
conflicted = "=${count}"
staged = "+${count}"
modified = "!${count}"
renamed = "󰑕${count}"
deleted = "x${count}"
typechanged = "${count}"
untracked = "?${count}"
stashed = "${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
# Each item is its own conditional group, so a clean repo prints nothing at all
# rather than a row of zeroes.
format = """\
([ $conflicted](bold fg:red bg:c3))\
([ $staged](fg:green bg:c3))\
([ $modified](fg:yellow bg:c3))\
([ $renamed](fg:purple bg:c3))\
([ $deleted](fg:red bg:c3))\
([ $typechanged](fg:blue bg:c3))\
([ $untracked](fg:bright-blue bg:c3))\
([ $stashed](fg:cyan bg:c3))\
([ $ahead_behind](fg:bright-purple bg:c3))\
[ ](bg:c3)"""


# ---------------------------------------------------------------------------
# c4 -- toolchain versions
# ---------------------------------------------------------------------------

[nodejs]
symbol = ""
format = "$symbol $version"

[bun]
symbol = ""

[python]
symbol = ""
format = '$symbol ${version}(\($virtualenv\))'

[rust]
symbol = "󱘗"

[golang]
symbol = ""

[lua]
symbol = ""

[php]
symbol = ""

[package]
symbol = "󰏗"

[docker_context]
symbol = ""
format = '$symbol $context'
# ---------------------------------------------------------------------------
# c5 -- the darkest stop: what the last command did, and the clock
# ---------------------------------------------------------------------------

# Only past the gate: a shell inside vifm's :shell or nvim's :terminal. tmux
# panes would otherwise all count one level deep too -- tmux/.tmux.conf unsets
# SHLVL for its panes so they start from 1 like a fresh terminal.
[sudo]
symbol = ""

[shlvl]
disabled = false
threshold = 2
symbol = ""
style = "fg:t5 bg:c5"
format = "[ $symbol$shlvl]($style)"

[jobs]
symbol = "󰜎"
style = "fg:t5 bg:c5"
format = "[ $symbol$number]($style)"

[cmd_duration]
min_time = 2000
style = "fg:t5 bg:c5"
format = "[ 󱎫$duration]($style)"

[status]
disabled = false
symbol = ""
style = "fg:red bg:c5"
format = "[ $symbol$status( $signal_name)]($style)"
# A failing pipeline shows every stage's code, e.g. "0|1|0"; killed commands
# show the signal name rather than 130/139.
pipestatus = true
pipestatus_separator = "|"
pipestatus_segment_format = "$status"
pipestatus_format = "[ $symbol$pipestatus( $signal_name)]($style)"
recognize_signal_code = true

[time]
disabled = false
time_format = "%R"
style = "fg:t5 bg:c5"
format = "[ $time ]($style)"

[character]
success_symbol = "[❯](bold fg:c2)"
error_symbol = "[❯](bold fg:red)"
vicmd_symbol = "[❮](bold fg:yellow)"
