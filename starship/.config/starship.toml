# starship prompt -- https://starship.rs
#
# Design goal: ONE hue per machine, so a glance at the prompt says which host
# you are on. Everything that is not the host marker stays greyscale-ish; the
# only other colour is the git-status icon row.
#
#   ▏ 󰀵 mbp ▏ ~/dev/dotfiles ▏  main  1 ?2 ⇡1 ▏  12:32 ▏
#   ❯
#
# The hue lives entirely in the palettes below. `palette` is set to a default
# here, but at shell start `sh/conf.d/60-starship.sh` rewrites that one line
# into a generated copy under ~/.cache/starship/ and points $STARSHIP_CONFIG
# at it -- that is how each host ends up a different colour from one shared
# file. Switch live with `starship-palette purple`, persist with
# `starship-palette -w purple`. See CLAUDE.md -> "## starship".
#
# NOTE: starship has no config includes and does not expand env vars inside
# style strings (both confirmed against starship 1.26), which is why the
# generate-a-copy dance exists instead of something more direct.

"$schema" = 'https://starship.rs/config-schema.json'

# Rewritten per host by 60-starship.sh. Keep this line's exact shape
# (`palette = "..."` at column 0) -- the sed in that script matches on it.
palette = "slate"

add_newline = true
command_timeout = 1000

format = """
[](host)\
$os\
$username\
$hostname\
[](fg:host bg:surface)\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$lua\
$package\
$jobs\
$cmd_duration\
$status\
$time\
[ ](bg:surface)\
[](fg:surface)\
$line_break\
$character"""


# ---------------------------------------------------------------------------
# Palettes: one per host. Only the first three colours differ between them --
# `host` is the pill behind the hostname (and the ❯), `surface` is the dark
# tint the rest of the bar sits on, `host_text` is the text on the pill.
# Add a palette here and it immediately shows up in `starship-palette`.
# ---------------------------------------------------------------------------

[palettes.cyan]
host = "#4cc3d9"
host_text = "#062026"
surface = "#12313a"
text = "#c4d6da"
muted = "#6f8d95"

[palettes.green]
host = "#7ec96a"
host_text = "#07200d"
surface = "#15301c"
text = "#c9d6c5"
muted = "#78947e"

[palettes.purple]
host = "#b07de0"
host_text = "#150a20"
surface = "#261a36"
text = "#d1c9dd"
muted = "#8c80a1"

[palettes.amber]
host = "#e0b04d"
host_text = "#231803"
surface = "#332612"
text = "#dbd2c1"
muted = "#998b6f"

[palettes.rose]
host = "#e0686f"
host_text = "#250a0d"
surface = "#331a1d"
text = "#dcc8ca"
muted = "#9b7a7e"

# Fallback for any machine that has not been assigned a colour yet.
[palettes.slate]
host = "#8f9bab"
host_text = "#12151a"
surface = "#262a31"
text = "#c8ccd4"
muted = "#7e858f"


# ---------------------------------------------------------------------------
# The host pill
# ---------------------------------------------------------------------------

[os]
disabled = false
style = "bg:host fg:host_text"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = "󰀵"
Arch = "󰣇"
Debian = "󰣚"
Ubuntu = "󰕈"
Fedora = "󰣛"
Alpine = ""
Raspbian = "󰐿"
Linux = "󰌽"
Windows = "󰍲"

# Only rendered when root or over SSH (starship's default), so the local
# machine stays short and remote sessions say who you are.
[username]
style_user = "bg:host fg:host_text"
style_root = "bg:host fg:host_text bold"
format = "[$user@]($style)"

[hostname]
ssh_only = false
# Shown only over SSH; another cue that this is not the laptop. It trails the
# hostname rather than leading it, so it does not wedge itself between the
# "user@" and the name.
ssh_symbol = " "
style = "bg:host fg:host_text"
format = "[$hostname$ssh_symbol ]($style)"
trim_at = "."


# ---------------------------------------------------------------------------
# The neutral bar
# ---------------------------------------------------------------------------

[directory]
style = "fg:text bg:surface"
format = "[ $path]($style)[$read_only]($read_only_style)"
read_only = " 󰌾"
read_only_style = "fg:red bg:surface"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Movies" = " "
"Developer" = " "
".config" = " "

[jobs]
style = "fg:muted bg:surface"
format = "[ $symbol$number]($style)"
symbol = "󰜎 "

[cmd_duration]
min_time = 2000
style = "fg:muted bg:surface"
format = "[ 󱎫 $duration]($style)"

[status]
disabled = false
style = "fg:red bg:surface"
format = "[ $symbol$status]($style)"
symbol = " "

[time]
disabled = false
time_format = "%R"
style = "fg:muted bg:surface"
format = "[  $time]($style)"

[character]
success_symbol = "[❯](bold fg:host)"
error_symbol = "[❯](bold fg:red)"
vicmd_symbol = "[❮](bold fg:yellow)"


# ---------------------------------------------------------------------------
# git -- the one place colour is allowed, one hue per kind of change
# ---------------------------------------------------------------------------

[git_branch]
symbol = ""
style = "fg:text bg:surface"
format = "[ $symbol ](fg:muted bg:surface)[$branch]($style)"

# Each item is its own conditional group, so an unchanged repo prints nothing
# at all and a dirty one prints only the icons that apply. Swap any icon
# below freely -- they are plain Nerd Font glyphs, nothing depends on them.
[git_status]
conflicted = " ${count}"
staged = " ${count}"
modified = " ${count}"
renamed = "󰑕 ${count}"
deleted = " ${count}"
typechanged = " ${count}"
untracked = " ${count}"
stashed = " ${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
format = """\
([ $conflicted](bold fg:red bg:surface))\
([ $staged](fg:green bg:surface))\
([ $modified](fg:yellow bg:surface))\
([ $renamed](fg:purple bg:surface))\
([ $deleted](fg:red bg:surface))\
([ $typechanged](fg:blue bg:surface))\
([ $untracked](fg:bright-blue bg:surface))\
([ $stashed](fg:cyan bg:surface))\
([ $ahead_behind](fg:bright-purple bg:surface))"""


# ---------------------------------------------------------------------------
# Toolchain versions: present, but deliberately dim -- they are context, not
# the thing you are looking for.
# ---------------------------------------------------------------------------

[nodejs]
style = "fg:muted bg:surface"
format = "[  $version]($style)"

[python]
style = "fg:muted bg:surface"
format = '[  ${version}(\($virtualenv\))]($style)'

[rust]
style = "fg:muted bg:surface"
format = "[  $version]($style)"

[golang]
style = "fg:muted bg:surface"
format = "[  $version]($style)"

[lua]
style = "fg:muted bg:surface"
format = "[  $version]($style)"

[package]
style = "fg:muted bg:surface"
format = "[  $version]($style)"
